<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="theme-color" name="theme-color" content="#f1f5f9" />
    <title>Envanter Sistemi</title>
    <script>
      (function () {
        var theme = localStorage.getItem('envanter-theme');
        var activeTheme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', activeTheme);
        document.getElementById('theme-color').content = activeTheme === 'dark' ? '#060a12' : '#f1f5f9';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
