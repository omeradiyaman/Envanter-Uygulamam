name: Envanter-Uygulamam

services:
  postgres:
    image: postgres:18.4-alpine
    container_name: inventory-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - inventory_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set in .env} -d ${POSTGRES_DB:?POSTGRES_DB must be set in .env}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: envanter-backend
    container_name: inventory-system-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB must be set in .env};Username=${POSTGRES_USER:?POSTGRES_USER must be set in .env};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      DeviceQr__PublicBaseUrl: "${PUBLIC_APP_URL:-http://localhost:8081}"
      DocumentStorage__RootPath: "/app/storage/assignment-documents"
      WarrantySettings__ExpiringSoonDays: "${WARRANTY_EXPIRING_SOON_DAYS:-90}"
      Cors__AllowedOrigins__0: "${PUBLIC_APP_URL:-http://localhost:8081}"
      IdentitySeed__AdminUserName: "${ADMIN_USER_NAME:-admin}"
      IdentitySeed__AdminPassword: "${ADMIN_INITIAL_PASSWORD:-}"
      DataProtection__KeysPath: "/app/data-protection-keys"
    volumes:
      - assignment_document_storage:/app/storage/assignment-documents
      - identity_data_protection:/app/data-protection-keys
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: envanter-frontend
    container_name: inventory-system-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-8081}:80"
    depends_on:
      - backend

volumes:
  inventory_postgres_data:
    # Pinned to the existing volume so data survives project renames
    name: envanter-uygulamam_inventory_postgres_data
  assignment_document_storage:
    name: envanter-uygulamam_assignment_document_storage
  identity_data_protection:
    name: envanter-uygulamam_identity_data_protection
